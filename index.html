<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffd9ec">
<title>Magnet Board</title>
<style>
  :root{
    --pad: 12px;
    --ink: #38304a;
    --panel: rgba(255,255,255,.86);
    --shadow: 0 6px 14px rgba(80,60,110,.18);
    --safe-t: env(safe-area-inset-top, 0px);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; overscroll-behavior:none; }
  body{
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, "Segoe UI", system-ui, sans-serif;
    color:var(--ink);
    background: linear-gradient(160deg,#ffe6f3 0%,#e6f4ff 45%,#e9ffe9 100%);
    display:flex; flex-direction:column;
    height:100dvh; width:100vw; overflow:hidden;
    user-select:none; -webkit-user-select:none;
  }

  /* ---------- Header ---------- */
  header{
    padding: calc(var(--safe-t) + 10px) var(--pad) 10px;
    background: var(--panel);
    backdrop-filter: blur(12px);
    box-shadow: 0 2px 10px rgba(120,90,150,.15);
    z-index: 5;
    display:flex; align-items:center; gap:10px;
  }
  .title{ font-size:15px; font-weight:800; letter-spacing:.2px; }
  .title small{ display:block; font-weight:600; font-size:10px; opacity:.55; letter-spacing:.4px; text-transform:uppercase; }
  .count-chip{
    margin-left:auto; display:flex; align-items:center; gap:7px;
    background: linear-gradient(135deg,#ffd166,#ff8fab);
    color:#fff; padding:7px 13px; border-radius:999px;
    font-weight:800; font-size:20px; line-height:1;
    box-shadow: var(--shadow); min-width:74px; justify-content:center;
    transition: transform .18s cubic-bezier(.3,1.6,.5,1);
  }
  .count-chip.pop{ transform:scale(1.16); }
  .count-chip span{ font-size:10px; opacity:.9; font-weight:700; text-transform:uppercase; }
  .cash-chip{
    background:#fff; border:none; color:#2f9e6f; font-weight:800; font-size:12px;
    padding:9px 12px; border-radius:999px; box-shadow:var(--shadow);
  }
  .cash-chip:disabled{ opacity:.45; }

  /* ---------- Board ---------- */
  .board-wrap{ flex:1; position:relative; overflow:hidden; padding:8px; }
  #board{
    position:relative; height:100%; width:100%; border-radius:20px; overflow:auto;
    -webkit-overflow-scrolling:touch;
    border:3px solid rgba(255,255,255,.9);
    box-shadow: inset 0 2px 10px rgba(110,80,140,.12), var(--shadow);
    background-color:#fffdf7;
    background-image:
      linear-gradient(45deg, rgba(255,183,197,.35) 25%, transparent 25%, transparent 75%, rgba(255,183,197,.35) 75%),
      linear-gradient(45deg, rgba(160,220,255,.32) 25%, transparent 25%, transparent 75%, rgba(160,220,255,.32) 75%),
      linear-gradient(0deg, rgba(255,255,255,0) 0, rgba(255,255,255,0) 100%);
    background-size: 68px 68px, 68px 68px;
    background-position: 0 0, 34px 34px;
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
    grid-auto-rows: 68px;
    align-content:start;
    padding:6px;
    gap:2px;
  }
  .magnet{
    display:flex; align-items:center; justify-content:center;
    border:none; background:none; padding:0; cursor:pointer;
    animation: plop .34s cubic-bezier(.25,1.7,.45,1) both;
    touch-action: manipulation;
  }
  .magnet svg{
    width:60px; height:60px; display:block;
    filter: drop-shadow(0 3px 3px rgba(90,60,110,.28));
  }
  .magnet.bye{ animation: bye .26s ease-in forwards; }
  @keyframes plop{ from{ transform:scale(.2) rotate(0deg); opacity:0 } }
  @keyframes bye{ to{ transform:scale(.1) rotate(35deg); opacity:0 } }
  .empty{
    position:absolute; inset:0; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:6px;
    font-size:13px; font-weight:700; opacity:.4; pointer-events:none; text-align:center;
  }
  .empty .big{ font-size:34px; }

  /* ---------- Controls ---------- */
  .controls{
    background:var(--panel); backdrop-filter: blur(12px);
    padding:10px var(--pad) calc(var(--safe-b) + 10px);
    box-shadow: 0 -2px 12px rgba(120,90,150,.16);
    display:flex; flex-direction:column; gap:8px; z-index:5;
  }
  .row{ display:flex; gap:8px; align-items:center; }
  .seg{ display:flex; gap:6px; flex:1; }
  .seg button{
    flex:1; border:2px solid transparent; background:#fff; border-radius:14px;
    padding:5px 0 3px; font-size:10px; font-weight:800; color:var(--ink);
    box-shadow:0 2px 5px rgba(120,90,150,.14); display:flex; flex-direction:column; align-items:center; gap:1px;
  }
  .seg button svg{ width:30px; height:30px; }
  .seg button[aria-pressed="true"]{ border-color:#ff8fab; background:#fff6fa; transform:translateY(-1px); }
  .swatches{ display:flex; gap:7px; flex:1; justify-content:space-between; }
  .sw{ width:29px; height:29px; border-radius:50%; border:3px solid #fff; box-shadow:0 2px 5px rgba(0,0,0,.18); padding:0; }
  .sw[aria-pressed="true"]{ border-color:var(--ink); transform:scale(1.14); }
  .stepper{ display:flex; align-items:center; gap:0; background:#fff; border-radius:14px; box-shadow:0 2px 5px rgba(120,90,150,.14); overflow:hidden; }
  .stepper button{ border:none; background:none; font-size:22px; font-weight:800; color:var(--ink); width:40px; height:40px; }
  .stepper button:disabled{ opacity:.3; }
  .stepper .val{ min-width:34px; text-align:center; font-weight:800; font-size:17px; }
  .add{
    flex:1; border:none; border-radius:16px; height:46px; color:#fff; font-size:15px; font-weight:800;
    background:linear-gradient(135deg,#7ed957,#2f9e6f); box-shadow:var(--shadow);
  }
  .add:active,.seg button:active,.sw:active,.cash-chip:active{ transform:scale(.96); }
  .lbl{ font-size:9px; font-weight:800; letter-spacing:.6px; text-transform:uppercase; opacity:.5; }

  /* ---------- Dialog ---------- */
  dialog{
    border:none; border-radius:24px; padding:0; width:min(340px, 88vw);
    box-shadow:0 20px 50px rgba(60,40,90,.35); color:var(--ink); background:#fff;
  }
  dialog::backdrop{ background:rgba(60,40,90,.45); backdrop-filter:blur(3px); }
  .dlg{ padding:18px; text-align:center; }
  .dlg h2{ margin:0 0 2px; font-size:19px; }
  .dlg .sub{ font-size:12px; opacity:.6; margin-bottom:14px; }
  .amount{ font-size:44px; font-weight:900; color:#2f9e6f; line-height:1; }
  .cost{ font-size:12px; font-weight:700; opacity:.65; margin-top:6px; }
  .dlg .stepper{ margin:12px auto; width:fit-content; }
  .dlg .stepper button{ width:54px; height:48px; font-size:26px; }
  .dlg .stepper .val{ display:none; }
  .quick{ display:flex; gap:6px; justify-content:center; margin-bottom:14px; flex-wrap:wrap; }
  .quick button{ border:2px solid #e6e0f0; background:#fff; border-radius:12px; padding:7px 11px; font-weight:800; font-size:13px; color:var(--ink); }
  .dlg-actions{ display:flex; gap:8px; }
  .dlg-actions button{ flex:1; border:none; border-radius:14px; height:46px; font-size:15px; font-weight:800; }
  .btn-cancel{ background:#f0ecf6; color:var(--ink); }
  .btn-ok{ background:linear-gradient(135deg,#7ed957,#2f9e6f); color:#fff; }
  .btn-ok:disabled{ opacity:.4; }
  .warn{ font-size:11px; color:#c2506a; font-weight:700; min-height:14px; }
</style>
</head>
<body>

<header>
  <div class="title">Magnet Board<small>tap a magnet to remove it</small></div>
  <button class="cash-chip" id="cashBtn">💵 Cash-in</button>
  <div class="count-chip" id="countChip"><b id="count">0</b><span>magnets</span></div>
</header>

<div class="board-wrap">
  <div id="board" aria-label="Magnet board"></div>
  <div class="empty" id="empty"><div class="big">🐤🦕🐱</div><div>Board's empty!<br>Add some magnets below.</div></div>
</div>

<div class="controls">
  <div class="row">
    <div class="seg" id="typeSeg">
      <button data-type="duck" aria-pressed="true"><span class="ico"></span>Duck</button>
      <button data-type="dino" aria-pressed="false"><span class="ico"></span>Dino</button>
      <button data-type="kitty" aria-pressed="false"><span class="ico"></span>Kitty</button>
    </div>
  </div>
  <div class="row">
    <div class="swatches" id="swatches"></div>
  </div>
  <div class="row">
    <div class="stepper">
      <button id="minus" aria-label="fewer">−</button>
      <div class="val" id="qty">1</div>
      <button id="plus" aria-label="more">+</button>
    </div>
    <button class="add" id="addBtn">Add Magnets</button>
  </div>
</div>

<dialog id="cashDlg">
  <div class="dlg">
    <h2>Cash-in Magnets</h2>
    <div class="sub">Exchange rate: 4 magnets = $1</div>
    <div class="amount" id="dlgAmount">$1</div>
    <div class="cost" id="dlgCost">costs 4 magnets</div>
    <div class="stepper">
      <button id="dMinus">−</button><div class="val"></div><button id="dPlus">+</button>
    </div>
    <div class="quick" id="quick"></div>
    <div class="warn" id="dlgWarn"></div>
    <div class="dlg-actions">
      <button class="btn-cancel" id="dlgCancel">Cancel</button>
      <button class="btn-ok" id="dlgOk">Cash In</button>
    </div>
  </div>
</dialog>

            </svg>`;
  }

  /* ---------- State ---------- */
  let magnets = load();
  let type = "duck";
  let color = COLORS[0];
  let qty = 1;

  function load(){
    try{
      const raw = JSON.parse(localStorage.getItem(KEY));
      if(Array.isArray(raw)) return raw.filter(m => m && m.type && m.color);
    }catch(e){}
    return [];
  }
  function save(){
    try{ localStorage.setItem(KEY, JSON.stringify(magnets)); }catch(e){}
  }

  /* ---------- DOM ---------- */
  const board = document.getElementById("board");
  const empty = document.getElementById("empty");
  const countEl = document.getElementById("count");
  const chip = document.getElementById("countChip");
  const cashBtn = document.getElementById("cashBtn");
  const qtyEl = document.getElementById("qty");
  const dlg = document.getElementById("cashDlg");

  function makeEl(m){
    const b = document.createElement("button");
    b.className = "magnet";
    b.dataset.id = m.id;
    b.style.transform = "rotate(" + m.rot + "deg)";
    b.setAttribute("aria-label", "Remove " + m.type + " magnet");
    b.innerHTML = svgFor(m.type, m.color);
    return b;
  }

  function render(){
    board.innerHTML = "";
    const frag = document.createDocumentFragment();
    magnets.forEach(m => frag.appendChild(makeEl(m)));
    board.appendChild(frag);
    updateCount();
  }

  function updateCount(){
    countEl.textContent = magnets.length;
    cashBtn.disabled = magnets.length < RATE;
    empty.style.display = magnets.length ? "none" : "flex";
    chip.classList.add("pop");
    setTimeout(() => chip.classList.remove("pop"), 180);
  }

  function addMagnets(n){
    for(let i=0;i<n;i++){
      const m = {
        id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
        type, color,
        rot: Math.round((Math.random()*30 - 15) * 10) / 10
      };
      magnets.push(m);
      const el = makeEl(m);
      el.style.animationDelay = (i * 40) + "ms";
      board.appendChild(el);
    }
    save(); updateCount();
    board.scrollTop = board.scrollHeight;
  }

  function removeById(id, el){
    const i = magnets.findIndex(m => m.id === id);
    if(i < 0) return;
    magnets.splice(i,1); save();
    el.classList.add("bye");
    setTimeout(() => { el.remove(); }, 250);
    updateCount();
  }

  board.addEventListener("click", e => {
    const el = e.target.closest(".magnet");
    if(el && !el.classList.contains("bye")) removeById(el.dataset.id, el);
  });

  /* ---------- Controls ---------- */
  document.querySelectorAll("#typeSeg button").forEach(btn => {
    btn.querySelector(".ico").innerHTML = svgFor(btn.dataset.type, "#FFC93C");
    btn.addEventListener("click", () => {
      type = btn.dataset.type;
      document.querySelectorAll("#typeSeg button").forEach(b =>
        b.setAttribute("aria-pressed", String(b === btn)));
      refreshIcons();
    });
  });

  const swWrap = document.getElementById("swatches");
  COLORS.forEach((c, i) => {
    const b = document.createElement("button");
    b.className = "sw"; b.style.background = c;
    b.setAttribute("aria-pressed", String(i === 0));
    b.setAttribute("aria-label", "color " + c);
    b.addEventListener("click", () => {
      color = c;
      swWrap.querySelectorAll(".sw").forEach(s => s.setAttribute("aria-pressed", String(s === b)));
      refreshIcons();
    });
    swWrap.appendChild(b);
  });

  function refreshIcons(){
    document.querySelectorAll("#typeSeg button").forEach(btn => {
      btn.querySelector(".ico").innerHTML = svgFor(btn.dataset.type, color);
    });
  }

  function setQty(n){
    qty = Math.min(25, Math.max(1, n));
    qtyEl.textContent = qty;
    document.getElementById("minus").disabled = qty <= 1;
    document.getElementById("plus").disabled = qty >= 25;
  }
  document.getElementById("minus").addEventListener("click", () => setQty(qty-1));
  document.getElementById("plus").addEventListener("click", () => setQty(qty+1));
  document.getElementById("addBtn").addEventListener("click", () => addMagnets(qty));

  /* ---------- Cash-in ---------- */
  let dollars = 1;
  const dAmount = document.getElementById("dlgAmount");
  const dCost = document.getElementById("dlgCost");
  const dWarn = document.getElementById("dlgWarn");
  const dOk = document.getElementById("dlgOk");
  const quick = document.getElementById("quick");

  [1,2,5,10].forEach(v => {
    const b = document.createElement("button");
    b.textContent = "$" + v;
    b.addEventListener("click", () => setDollars(v));
    quick.appendChild(b);
  });

  function maxDollars(){ return Math.floor(magnets.length / RATE); }

  function setDollars(v){
    const max = Math.max(1, maxDollars());
    dollars = Math.min(max, Math.max(1, v));
    dAmount.textContent = "$" + dollars;
    const cost = dollars * RATE;
    dCost.textContent = "costs " + cost + " magnets";
    const ok = cost <= magnets.length;
    dOk.disabled = !ok;
    dWarn.textContent = ok ? "" : "Not enough magnets yet!";
    document.getElementById("dMinus").disabled = dollars <= 1;
    document.getElementById("dPlus").disabled = dollars >= max;
  }
  document.getElementById("dMinus").addEventListener("click", () => setDollars(dollars-1));
  document.getElementById("dPlus").addEventListener("click", () => setDollars(dollars+1));
  document.getElementById("dlgCancel").addEventListener("click", () => dlg.close());

  dOk.addEventListener("click", () => {
    const cost = dollars * RATE;
    if(cost > magnets.length) return;
    magnets.splice(magnets.length - cost, cost);
    save(); render();
    dlg.close();
    setTimeout(() => alert("🎉 Cashed in " + cost + " magnets for $" + dollars + "!"), 120);
  });

  cashBtn.addEventListener("click", () => {
    setDollars(Math.min(dollars, Math.max(1, maxDollars())));
    if(typeof dlg.showModal === "function") dlg.showModal();
  });

  /* ---------- Init ---------- */
  refreshIcons();
  setQty(1);
  render();

  // keep double-tap from zooming on iOS
  let lastTouch = 0;
  document.addEventListener("touchend", e => {
    const now = Date.now();
    if(now - lastTouch < 320) e.preventDefault();
    lastTouch = now;
  }, {passive:false});
})();
</script>
